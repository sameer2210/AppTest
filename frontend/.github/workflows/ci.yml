name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'ankush-**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop
      - 'ankush-**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Format, Types, Tests & iOS ATT Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Format Check (Prettier)
        run: npm run format:check

      - name: Run Type Check (tsc)
        run: npm run check-types

      - name: Run Tests
        run: npm test

      - name: Verify iOS No-ATT Compliance
        run: npm run verify:ios-no-att
